services:
  # ============================================================================
  # Primary Database: MongoDB 7
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: chaos-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-acme}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro,z
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Acme Checkout Service (acme-checkout)
  # ============================================================================
  checkout:
    build:
      context: .
      dockerfile: apps/checkout/Dockerfile
    container_name: chaos-checkout
    restart: unless-stopped
    ports:
      - "${CHECKOUT_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - CHECKOUT_PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/acme
      - MONGODB_DATABASE=${MONGODB_DATABASE:-acme}
      - PAYMENT_PROVIDER_URL=http://payment-provider:3002
      - WEBHOOK_TIMEOUT_MS=800
    depends_on:
      mongodb:
        condition: service_healthy

  # ============================================================================
  # External Payment Provider Simulator (fake-payment-provider)
  # ============================================================================
  payment-provider:
    build:
      context: .
      dockerfile: apps/payment-provider/Dockerfile
    container_name: chaos-payment-provider
    restart: unless-stopped
    ports:
      - "${PAYMENT_PROVIDER_PORT:-3002}:3002"
    environment:
      - NODE_ENV=production
      - PAYMENT_PROVIDER_PORT=3002
      - CHECKOUT_WEBHOOK_URL=http://checkout:3001/webhooks/payment-confirmed
    depends_on:
      checkout:
        condition: service_started

  # ============================================================================
  # Chaos Web Dashboard & Control Plane (chaos-web)
  # ============================================================================
  chaos-web:
    build:
      context: .
      dockerfile: apps/chaos-web/Dockerfile
    container_name: chaos-web
    restart: unless-stopped
    ports:
      - "${CHAOS_WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - CHAOS_WEB_PORT=3000
      - CHECKOUT_URL=http://checkout:3001
      - CHECKOUT_SERVICE_URL=http://checkout:3001
      - PAYMENT_PROVIDER_URL=http://payment-provider:3002
      - MONGODB_URI=mongodb://mongodb:27017/acme
      - MONGODB_DATABASE=${MONGODB_DATABASE:-acme}
    depends_on:
      mongodb:
        condition: service_healthy
      checkout:
        condition: service_started
      payment-provider:
        condition: service_started

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  mongo_data:
    name: chaos_mongo_data

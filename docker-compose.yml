services:
  # ============================================================================
  # Primary Database: MongoDB 7
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: chaos-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-acme}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro,z
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Acme Checkout Service (acme-checkout)
  # ============================================================================
  checkout:
    build:
      context: .
      dockerfile: apps/checkout/Dockerfile
    container_name: chaos-checkout
    restart: unless-stopped
    ports:
      - "${CHECKOUT_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - CHECKOUT_PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/acme
      - MONGODB_DATABASE=${MONGODB_DATABASE:-acme}
      - PAYMENT_PROVIDER_URL=http://payment-provider:3002
      - WEBHOOK_TIMEOUT_MS=800
    depends_on:
      mongodb:
        condition: service_healthy

  # ============================================================================
  # External Payment Provider Simulator (fake-payment-provider)
  # ============================================================================
  payment-provider:
    build:
      context: .
      dockerfile: apps/payment-provider/Dockerfile
    container_name: chaos-payment-provider
    restart: unless-stopped
    ports:
      - "${PAYMENT_PROVIDER_PORT:-3002}:3002"
    environment:
      - NODE_ENV=production
      - PAYMENT_PROVIDER_PORT=3002
      - CHECKOUT_WEBHOOK_URL=http://checkout:3001/webhooks/payment-confirmed
    depends_on:
      checkout:
        condition: service_started

  # ============================================================================
  # Chaos Web Dashboard & Control Plane (chaos-web)
  # ============================================================================
  chaos-web:
    build:
      context: .
      dockerfile: apps/chaos-web/Dockerfile
    container_name: chaos-web
    restart: unless-stopped
    ports:
      - "${CHAOS_WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - CHAOS_WEB_PORT=3000
      - CHECKOUT_URL=http://checkout:3001
      - CHECKOUT_SERVICE_URL=http://checkout:3001
      - PAYMENT_PROVIDER_URL=http://payment-provider:3002
      - MONGODB_URI=mongodb://mongodb:27017/acme
      - MONGODB_DATABASE=${MONGODB_DATABASE:-acme}
    depends_on:
      mongodb:
        condition: service_healthy
      checkout:
        condition: service_started
      payment-provider:
        condition: service_started

  # ============================================================================
  # Prometheus Time-Series Metrics Engine
  # ============================================================================
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: chaos-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      checkout:
        condition: service_started
      payment-provider:
        condition: service_started
      chaos-web:
        condition: service_started

  # ============================================================================
  # Grafana Visualization & Observability Dashboard
  # ============================================================================
  grafana:
    image: grafana/grafana:11.5.2
    container_name: chaos-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,z
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,z
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro,z
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

# ==============================================================================
# Persistent Named Volumes & Networks
# ==============================================================================
volumes:
  mongo_data:
    name: chaos_mongo_data
  prometheus_data:
    name: chaos_prometheus_data
  grafana_data:
    name: chaos_grafana_data

networks:
  default:
    name: chaos-net
